name: massa_wallet
description: "Pyramids Wallet - Secure self-custodial Flutter wallet for the Massa blockchain with dApp browser, embedded node, staking and background sync."
publish_to: "none"
version: 1.5.1+7

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management
  provider: ">=6.1.0 <7.0.0"
  # Massa crypto (pure Dart, CI-safe)
  ed25519_edwards: ">=0.3.2 <0.4.0"
  blake3_dart: ">=1.0.0 <2.0.0"
  crypto: ">=3.0.3 <4.0.0"
  pointycastle: ">=3.9.0 <5.0.0"
  # Network / JSON-RPC
  http: ">=1.2.0 <2.0.0"
  # Security
  flutter_secure_storage: ">=10.0.0 <12.0.0"
  local_auth: ">=2.2.0 <4.0.0"
  # Background sync (foreground service)
  flutter_background_service: ">=5.0.10 <6.0.0"
  flutter_local_notifications: ">=17.2.0 <23.0.0"
  # Utility / storage
  shared_preferences: ">=2.2.3 <3.0.0"
  path_provider: ">=2.1.3 <3.0.0"
  # UI
  qr_flutter: ">=4.1.0 <5.0.0"
  mobile_scanner: ">=6.0.0 <8.0.0"
  # DApp browser
  webview_flutter: ">=4.10.0 <5.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Embedded node base config (official massa DEVN.30.2 buildnet profile,
  # patched to loopback binds at runtime). See lib/core/services/
  # embedded_node_service.dart.
  assets:
    - assets/node/
    - assets/node/gas_costs/
    - assets/icon/pyramids_logo.png

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/pyramids_icon.png"
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/icon/pyramids_icon_foreground.png"
