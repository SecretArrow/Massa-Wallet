name: massa_wallet
description: "Pine Wallet - Secure self-custodial Flutter wallet for the Massa blockchain with dApp browser, embedded node, staking and background sync."
publish_to: "none"
version: 1.8.1+13

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management
  provider: ">=6.1.0 <7.0.0"
  # Massa crypto (pure Dart, CI-safe)
  ed25519_edwards: ">=0.3.2 <0.4.0"
  blake3_dart: ">=1.0.0 <2.0.0"
  crypto: ">=3.0.3 <4.0.0"
  pointycastle: ">=3.9.0 <5.0.0"
  # Network / JSON-RPC
  http: ">=1.2.0 <2.0.0"
  # Security
  flutter_secure_storage: ">=10.0.0 <12.0.0"
  local_auth: ">=2.2.0 <4.0.0"
  # Background sync (default: WorkManager periodic workers — not a
  # foreground service, so Android 15's 6 h/day dataSync FGS cap does
  # not apply. Pinned 0.9.2 = last release compatible with the CI
  # Flutter 3.35 toolchain (see dependency_overrides below).
  workmanager: "0.9.2"
  # Legacy realtime mode (opt-in, Android <= 14 only)
  flutter_background_service: ">=5.0.10 <6.0.0"
  flutter_local_notifications: ">=17.2.0 <23.0.0"
  # Utility / storage
  shared_preferences: ">=2.2.3 <3.0.0"
  path_provider: ">=2.1.3 <3.0.0"
  # UI
  qr_flutter: ">=4.1.0 <5.0.0"
  mobile_scanner: ">=6.0.0 <8.0.0"
  # DApp browser
  webview_flutter: ">=4.10.0 <5.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Embedded node base configs (official massa profiles patched to
  # loopback binds at runtime). Buildnet: DEVN.30.2. Mainnet: MAIN.5.0
  # (real genesis ledger/rolls/deferred-credits). See
  # lib/core/services/embedded_node_service.dart.
  assets:
    - assets/node/
    - assets/node/gas_costs/
    - assets/node/mainnet/
    - assets/node/mainnet/gas_costs/
    - assets/icon/pine_logo.png

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/pine_icon.png"
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/icon/pine_icon_foreground.png"

# workmanager's federated 0.9.x releases are internally broken for
# Flutter <3.38: platform_interface 0.9.4 added `foregroundServiceConfig`
# to the abstract interface, but the newest apple implementation that
# still supports Flutter 3.32-3.37 (workmanager_apple 0.9.4) was compiled
# against platform_interface 0.9.3 — resulting in a compile error on ANY
# device build. Pinning platform_interface 0.9.3 restores the coherent
# upstream set (main 0.9.2 + apple 0.9.4 + android 0.9.2). This app never
# uses foregroundServiceConfig (we deliberately do NOT run workers as
# foreground services — that is the whole point of the 6 h-cap fix).
# android is pinned to 0.9.2 for the same reason (0.9.3 targets pi
# 0.9.4).
dependency_overrides:
  workmanager_platform_interface: "0.9.3"
  workmanager_android: "0.9.2"
