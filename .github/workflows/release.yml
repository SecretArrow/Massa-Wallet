name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Build type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  # Cross-compiles the official massa-node binary (pinned DEVN.30.2 —
  # the version buildnet runs) to Android arm64 with cargo-ndk.
  # The result is staged as jniLibs/arm64-v8a/libmassa_node.so so the
  # APK can execute it from nativeLibraryDir (in-app embedded node).
  # libc++_shared.so is bundled alongside: if the binary links the
  # shared C++ runtime, the Bionic linker resolves it from
  # nativeLibraryDir (LD_LIBRARY_PATH) instead of failing with
  # "CANNOT LINK EXECUTABLE: library libc++_shared.so not found".
  # Non-fatal: if the Rust build fails, the release still ships without
  # the embedded node and the app falls back to Public/Custom RPC.
  build-node:
    name: Cross-compile massa-node (Android arm64, buildnet)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Android Rust target (explicit)
        run: |
          rustup target add aarch64-linux-android
          rustup target list --installed

      - name: Locate Android NDK
        run: echo "ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | head -n 1)" >> "$GITHUB_ENV"

      - name: Download massa source (DEVN.30.2)
        run: |
          curl -sL -o massa.tar.gz \
            "https://codeload.github.com/massalabs/massa/tar.gz/refs/tags/DEVN.30.2"
          mkdir massa && tar xzf massa.tar.gz -C massa --strip-components=1

      - name: Install Android target on the massa-pinned toolchain
        # massa pins its toolchain via rust-toolchain.toml (e.g. 1.91.1);
        # the android std must be added to THAT toolchain, not just stable.
        working-directory: massa
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
          rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: massa
          prefix-key: massa-node-android-arm64
          cache-on-failure: true

      - name: Patch jemalloc off for Android (bionic)
        working-directory: massa
        run: |
          # Gate the unix-only jemalloc deps behind not(android) so the
          # bionic build links the system allocator instead.
          sed -i "s/\[target\.'cfg(unix)'\.dependencies\]/[target.'cfg(all(unix, not(target_os = \"android\")))'.dependencies]/" massa-node/Cargo.toml
          sed -i "s/#\[cfg(unix)\]/#[cfg(all(unix, not(target_os = \"android\")))]/" massa-node/src/main.rs
          # On android cfg(not(unix)) is FALSE too, so the worker crates
          # would go unlinked — add an android section without the
          # jemalloc features.
          printf '\n[target.%s.dependencies]\nmassa_db_worker = { workspace = true }\nmassa_event_cache = { workspace = true }\nmassa_execution_worker = { workspace = true }\n' "'cfg(target_os = \"android\")'" >> massa-node/Cargo.toml
          grep -n "not(target_os\|target_os = \"android\"" massa-node/Cargo.toml massa-node/src/main.rs

      - name: Build massa-node (aarch64-linux-android)
        working-directory: massa
        env:
          # 16 KB page compatibility (Pixel 2023+ / Play requirement) +
          # DT_RUNPATH=$ORIGIN: the Bionic linker then resolves
          # libc++_shared.so from the executable's OWN directory even if
          # the spawning environment lacks LD_LIBRARY_PATH (GitHub issue:
          # "CANNOT LINK EXECUTABLE: library libc++_shared.so not found").
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-rpath,$ORIGIN"
          CARGO_TERM_COLOR: always
        run: |
          # --platform 24: RocksDB's io_posix.cc needs posix_madvise
          # (POSIX_MADV_*) which bionic only exposes from API 23+; the app's
          # minSdk is 24, so compile against 24.
          cargo ndk --platform 24 -t arm64-v8a build --release -p massa-node
          file target/aarch64-linux-android/release/massa-node

      - name: Inspect dynamic dependencies (link diagnostics)
        working-directory: massa
        run: |
          READELF="$(ls -d $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin)/llvm-readelf"
          "$READELF" -d target/aarch64-linux-android/release/massa-node | grep -E 'NEEDED|RUNPATH|RPATH' || true
          if ! "$READELF" -d target/aarch64-linux-android/release/massa-node | grep -qE 'RUNPATH|RPATH'; then
            echo "::error::massa-node binary has no DT_RUNPATH — libc++_shared.so would only resolve via LD_LIBRARY_PATH"
          fi

      - name: Stage binary + C++ runtime as jniLibs
        run: |
          mkdir -p out
          cp massa/target/aarch64-linux-android/release/massa-node out/libmassa_node.so
          "$(ls -d $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin)/llvm-strip" out/libmassa_node.so || true
          chmod +x out/libmassa_node.so
          # Ship the NDK C++ runtime next to the executable so the Bionic
          # linker can resolve it from nativeLibraryDir (LD_LIBRARY_PATH
          # of app processes includes that directory). Harmless when the
          # binary links libc++ statically.
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" out/libc++_shared.so
          ls -la out

      - name: Upload node binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: massa-node-android-arm64
          path: out/
          retention-days: 7
          if-no-files-found: error

  # Same cross-compile for MAINNET (pinned MAIN.5.0 — the mainnet chain
  # id is baked into the binary at compile time, so a separate build is
  # REQUIRED; a buildnet binary can never serve mainnet). Non-fatal.
  build-node-mainnet:
    name: Cross-compile massa-node (Android arm64, mainnet)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Locate Android NDK
        run: echo "ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | head -n 1)" >> "$GITHUB_ENV"

      - name: Download massa source (MAIN.5.0)
        run: |
          curl -sL -o massa-mainnet.tar.gz \
            "https://codeload.github.com/massalabs/massa/tar.gz/refs/tags/MAIN.5.0"
          mkdir massa-mainnet && tar xzf massa-mainnet.tar.gz -C massa-mainnet --strip-components=1

      - name: Install Android target on the massa-pinned toolchain
        working-directory: massa-mainnet
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
          rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: massa-mainnet
          prefix-key: massa-node-android-arm64-mainnet
          cache-on-failure: true

      - name: Patch jemalloc off for Android (bionic, tolerant)
        working-directory: massa-mainnet
        run: |
          # Tolerant versions of the buildnet patches — the MAIN.5.0 tree
          # may drift; a no-op sed must not fail the job.
          sed -i "s/\[target\.'cfg(unix)'\.dependencies\]/[target.'cfg(all(unix, not(target_os = \"android\")))'.dependencies]/" massa-node/Cargo.toml || true
          sed -i "s/#\[cfg(unix)\]/#[cfg(all(unix, not(target_os = \"android\")))]/" massa-node/src/main.rs || true
          printf '\n[target.%s.dependencies]\nmassa_db_worker = { workspace = true }\nmassa_event_cache = { workspace = true }\nmassa_execution_worker = { workspace = true }\n' "'cfg(target_os = \"android\")'" >> massa-node/Cargo.toml || true
          grep -n "target_os" massa-node/Cargo.toml massa-node/src/main.rs || true

      - name: Build massa-node (aarch64-linux-android, mainnet)
        working-directory: massa-mainnet
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-rpath,$ORIGIN"
          CARGO_TERM_COLOR: always
        run: |
          cargo ndk --platform 24 -t arm64-v8a build --release -p massa-node
          file target/aarch64-linux-android/release/massa-node

      - name: Inspect dynamic dependencies (link diagnostics)
        working-directory: massa-mainnet
        run: |
          READELF="$(ls -d $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin)/llvm-readelf"
          "$READELF" -d target/aarch64-linux-android/release/massa-node | grep -E 'NEEDED|RUNPATH|RPATH' || true
          if ! "$READELF" -d target/aarch64-linux-android/release/massa-node | grep -qE 'RUNPATH|RPATH'; then
            echo "::error::massa-node binary has no DT_RUNPATH — libc++_shared.so would only resolve via LD_LIBRARY_PATH"
          fi

      - name: Stage mainnet binary + C++ runtime as jniLibs
        run: |
          mkdir -p out
          cp massa-mainnet/target/aarch64-linux-android/release/massa-node out/libmassa_node_mainnet.so
          "$(ls -d $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin)/llvm-strip" out/libmassa_node_mainnet.so || true
          chmod +x out/libmassa_node_mainnet.so
          # Redundant with the buildnet artifact on purpose: when THIS
          # job is the only node build that succeeds, the C++ runtime
          # must still ship — a mainnet binary without libc++_shared.so
          # crashes with "CANNOT LINK EXECUTABLE" at first start.
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" out/libc++_shared.so
          ls -la out

      - name: Upload mainnet node binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: massa-node-android-arm64-mainnet
          path: out/
          retention-days: 7
          if-no-files-found: error

  build-apk:
    name: Build & publish APK
    # Wait for BOTH node jobs (otherwise the mainnet artifact upload races
    # the build and the APK ships without the mainnet embedded node).
    needs: [build-node, build-node-mainnet]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch embedded node binaries (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: massa-node-android-arm64
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Fetch embedded node MAINNET binary (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: massa-node-android-arm64-mainnet
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Report embedded node presence
        run: |
          for f in libmassa_node.so libc++_shared.so libmassa_node_mainnet.so; do
            if [ -f "android/app/src/main/jniLibs/arm64-v8a/$f" ]; then
              echo "Embedded node: $f INCLUDED"
            else
              echo "Embedded node: $f NOT included"
            fi
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter (cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (gate)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests (gate)
        run: flutter test --reporter compact

      - name: Restore signing keystore from encrypted key-sign-apk.zip
        id: keystore
        env:
          KEY_SIGN_PASSWORD: ${{ secrets.KEY_SIGN_PASSWORD }}
        run: |
          if [ -z "$KEY_SIGN_PASSWORD" ]; then
            echo "::warning::Secret KEY_SIGN_PASSWORD not set - APKs will be debug-signed"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f key-sign-apk.zip ]; then
            echo "::warning::key-sign-apk.zip not found - APKs will be debug-signed"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SIGN_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$SIGN_DIR"
          # AES-256 zip requires 7z (preinstalled on GitHub runners);
          # standard unzip cannot read WinZip-AES archives.
          7z x -y -p"$KEY_SIGN_PASSWORD" -o"$SIGN_DIR" key-sign-apk.zip > /dev/null
          KS_FILE="$SIGN_DIR/pine-release.keystore"
          test -f "$KS_FILE"
          # key.properties is transient build config (git-ignored).
          {
            echo "storeFile=$KS_FILE"
            echo "storePassword=$KEY_SIGN_PASSWORD"
            echo "keyAlias=pine-wallet"
            echo "keyPassword=$KEY_SIGN_PASSWORD"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
          FPR="$(keytool -list -v -keystore "$KS_FILE" -storepass "$KEY_SIGN_PASSWORD" -alias pine-wallet 2>/dev/null | grep 'SHA256:' | head -1 | sed 's/^[[:space:]]*//')"
          {
            echo "### 🔐 Release signing active"
            echo ""
            echo "Keystore restored from \`key-sign-apk.zip\` (AES-256) — alias \`pine-wallet\`."
            echo ""
            echo '```'
            echo "$FPR"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build split APKs (${{ github.event.inputs.channel || 'release' }})
        run: |
          flutter build apk \
            --${{ github.event.inputs.channel || 'release' }} \
            --split-per-abi \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="$(git rev-list --count HEAD)"

      # Fat APK containing every ABI — a fallback for users who are unsure
      # which split matches their phone (wrong-ABI download is a classic
      # cause of "App not installed").
      - name: Build universal APK (${{ github.event.inputs.channel || 'release' }})
        run: |
          flutter build apk \
            --${{ github.event.inputs.channel || 'release' }} \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="$(git rev-list --count HEAD)"

      - name: Rename artifacts
        run: |
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/*.apk; do
            b="$(basename "$f")"
            case "$b" in
              app-release.apk) out="dist/PineWallet-universal-release.apk" ;;
              app-debug.apk)   out="dist/PineWallet-universal-debug.apk" ;;
              *)               out="dist/PineWallet-$b" ;;
            esac
            cp "$f" "$out"
          done
          ls -la dist

      - name: Verify release signatures (apksigner)
        if: steps.keystore.outputs.signed == 'true'
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)"
          {
            echo "### Signature verification (apksigner)"
            echo '```'
            for apk in build/app/outputs/flutter-apk/*-release.apk; do
              [ -f "$apk" ] || continue
              echo "--- $(basename "$apk")"
              # --verbose prints per-scheme results (v1/v2/v3) so a missing
              # scheme can never go unnoticed in the summary.
              "$APKSIGNER" verify --verbose --print-certs "$apk" \
                | grep -E '^Verifies|Verified using|Signer #1 certificate SHA-256' || true
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wipe signing material from runner
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/signing"
          rm -f android/key.properties
          echo "signing material wiped (unpacked keystore + key.properties)"

      # Auto-generated install guide + download verification table. Truncated
      # downloads (the #1 cause of "App not installed as package appears to
      # be invalid") are caught immediately by comparing byte sizes.
      - name: Install guide + SHA-256 checksums (release notes)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo "## 📲 Cara install / How to install (Android)"
            echo ""
            echo "1. **Pernah memasang versi 1.8.0 atau lebih lama? UNINSTALL dulu** — rilis lama ditandatangani debug key sehingga Android menolak diperbarui dengan APK bertanda tangan baru; galatnya biasanya tampil sebagai *“App not installed as package appears to be invalid”*. Buka Setelan → Aplikasi → Pine Wallet (atau Pyramids Wallet) → Uninstall. / *If you ever installed v1.8.0 or older, uninstall it first — Android refuses to update a debug-signed install with a new signing key.*"
            echo "2. Pilih file sesuai HP Anda: **arm64-v8a** (hampir semua HP sejak 2019 — pilihan utama) · **armeabi-v7a** (HP 32-bit lama) · **x86_64** (emulator/Chromebook) · **universal** (semua arsitektur dalam satu file — paling aman bila ragu)."
            echo "3. Unduh **langsung di HP**, buka filenya, izinkan *Install unknown apps* bila diminta."
            echo ""
            echo "Install masih gagal? Cek ukuran file — harus **persis sama** dengan tabel di bawah (unduhan terpotong adalah penyebab tersering), lalu baca [docs/INSTALL.md](https://github.com/SecretArrow/Massa-Wallet/blob/main/docs/INSTALL.md)."
            echo ""
            echo "## 🔍 SHA-256 & ukuran unduhan"
            echo ""
            echo "| File | Ukuran (byte) | SHA-256 |"
            echo "|------|--------------:|---------|"
            for f in dist/*.apk; do
              s=$(stat -c%s "$f")
              h=$(sha256sum "$f" | cut -d' ' -f1)
              echo "| $(basename "$f") | $s | \`$h\` |"
            done
          } > release_body.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: release_body.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: pine-wallet-apk
          path: dist/*.apk
          retention-days: 14

  build-ios:
    name: Build unsigned iOS app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="$(git rev-list --count HEAD)"

      - name: Package unsigned .app → zip (sideload via AltStore/Sideloadly)
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qry PineWallet-ios-unsigned.zip Payload && cd ..
          ls -la dist

      - name: Attach iOS zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PineWallet-ios-unsigned.zip
          generate_release_notes: false

      - name: Upload artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: pine-wallet-ios
          path: dist/*.zip
          retention-days: 14
