name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Build type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter (cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (gate)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests (gate)
        run: flutter test --reporter compact

      - name: Build split APKs (${{ github.event.inputs.channel || 'release' }})
        run: |
          flutter build apk \
            --${{ github.event.inputs.channel || 'release' }} \
            --split-per-abi \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="$(git rev-list --count HEAD)"

      - name: Rename artifacts
        run: |
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/*.apk; do
            cp "$f" "dist/MassaWallet-$(basename "$f")"
          done
          ls -la dist

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: massa-wallet-apk
          path: dist/*.apk
          retention-days: 14

  build-ios:
    name: Build unsigned iOS app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="$(git rev-list --count HEAD)"

      - name: Package unsigned .app → zip (sideload via AltStore/Sideloadly)
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qry MassaWallet-ios-unsigned.zip Payload && cd ..
          ls -la dist

      - name: Attach iOS zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MassaWallet-ios-unsigned.zip
          generate_release_notes: false

      - name: Upload artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: massa-wallet-ios
          path: dist/*.zip
          retention-days: 14
