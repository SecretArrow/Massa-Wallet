name: Auto-fix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # weekly, Mondays 02:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    name: dart fix + format → PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Apply dart fix
        run: dart fix --apply

      - name: Apply dart format
        run: dart format .

      - name: Re-run tests after fixes
        run: flutter test --reporter compact

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create auto-fix PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-fix
          title: "chore: auto-fix (dart fix + format)"
          body: |
            Automated fixes:
            - `dart fix --apply`
            - `dart format .`
            - Unit/widget tests re-run and passing.

            Review & merge to keep the codebase clean. 🤖
          commit-message: "chore: apply dart fix + dart format [skip ci]"
          delete-branch: true
